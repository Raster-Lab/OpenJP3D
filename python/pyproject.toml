[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "openjp3d"
version = "1.0.0"
description = "Python bindings for the OpenJP3D JPEG 2000 Part 10 (JP3D) volumetric codec"
readme = "README.md"
license = { text = "BSD-2-Clause" }
authors = [
    { name = "OpenJP3D Contributors" },
]
keywords = ["jpeg2000", "jp3d", "volumetric", "compression", "medical imaging"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.20"]
dev = ["numpy>=1.20", "pytest>=7"]

[project.urls]
Homepage = "https://github.com/Raster-Lab/OpenJP3D"
Repository = "https://github.com/Raster-Lab/OpenJP3D"
"Bug Tracker" = "https://github.com/Raster-Lab/OpenJP3D/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["openjp3d*"]
