name: Create Release Branch

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        type: string
      ref:
        description: 'Source branch or SHA to create the release from (defaults to the default branch)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  create-release-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format '${VERSION}'. Expected semantic version (e.g. 1.0.0)."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check branch does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="release/v${{ steps.version.outputs.version }}"
          if gh api "repos/${{ github.repository }}/branches/${BRANCH}" > /dev/null 2>&1; then
            echo "::error::Branch '${BRANCH}' already exists."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Create release branch
        run: |
          BRANCH="release/v${{ steps.version.outputs.version }}"
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"
          echo "Created branch **${BRANCH}**" >> "$GITHUB_STEP_SUMMARY"
